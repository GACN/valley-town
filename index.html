<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>山谷小镇 · Valley Town</title>
<script>window.__errs=[];window.addEventListener('error',e=>{window.__errs.push(e.message+' @ '+(e.filename||'').split('/').pop()+':'+e.lineno)});</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220;
    font-family: "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif; color: #f4efe4; }
  #scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .ui { position: fixed; z-index: 20; }

  /* 顶部信息 */
  #top { top: 0; left: 0; right: 0; padding: 14px 16px; display: flex; justify-content: space-between;
         align-items: flex-start; pointer-events: none;
         background: linear-gradient(180deg, rgba(6,12,20,.55), rgba(6,12,20,0)); }
  #brand { font-size: 15px; letter-spacing: .22em; font-weight: 700; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  #brand small { display: block; font-size: 10px; letter-spacing: .3em; opacity: .6; font-weight: 400; margin-top: 3px; }
  #meter { text-align: right; font-variant-numeric: tabular-nums; }
  #clock { font-size: 26px; font-weight: 700; letter-spacing: .04em; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  #meter .sub { font-size: 11px; opacity: .75; letter-spacing: .16em; margin-top: 2px; }
  #weathernow { color: #ffd79a; }

  /* 居民面板 */
  #panel { top: 84px; right: 16px; width: 214px; padding: 12px 12px 10px;
           border-radius: 14px; background: rgba(10,18,28,.42); backdrop-filter: blur(14px) saturate(1.2);
           -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid rgba(255,255,255,.12);
           box-shadow: 0 10px 30px rgba(0,0,0,.28); }
  #panel h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .2em; font-weight: 600; opacity: .72; }
  #residents { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: hidden; }
  #residents li { font-size: 11.5px; line-height: 1.35; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.06);
                  display: flex; flex-wrap: wrap; gap: 5px; align-items: baseline; }
  #residents li:first-child { border-top: none; }
  #residents b { font-size: 12px; font-weight: 700; }
  #residents .job { font-size: 10px; opacity: .5; }
  #residents em { font-size: 10.5px; color: #ffd79a; font-style: normal; margin-left: auto; }
  #residents i { font-size: 10.5px; opacity: .62; font-style: normal; flex-basis: 100%; }

  /* 底部提示 */
  #hint { left: 16px; bottom: 92px; font-size: 11.5px; letter-spacing: .06em; opacity: .8;
          text-shadow: 0 1px 8px rgba(0,0,0,.8); pointer-events: none; max-width: 58vw; }
  #toast { left: 50%; transform: translateX(-50%); bottom: 128px; padding: 8px 16px; border-radius: 999px;
           background: rgba(8,14,22,.66); border: 1px solid rgba(255,255,255,.14); font-size: 12.5px;
           opacity: 0; transition: opacity .35s; pointer-events: none; backdrop-filter: blur(10px); white-space: nowrap; }

  /* 右侧按钮 */
  #dock { right: 14px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .row { display: flex; gap: 6px; }
  button { font-family: inherit; font-size: 11.5px; letter-spacing: .08em; color: #f1ebdd; cursor: pointer;
           padding: 9px 12px; border-radius: 11px; border: 1px solid rgba(255,255,255,.16);
           background: rgba(12,20,30,.52); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           transition: transform .12s, background .2s, border-color .2s; }
  button:active { transform: scale(.95); }
  button.on { background: rgba(255,203,122,.22); border-color: rgba(255,203,122,.6); color: #ffe6b8; }
  .k { opacity: .45; font-size: 10px; margin-left: 4px; }

  /* 摇杆 */
  #leftzone { position: fixed; left: 0; bottom: 0; width: 42vw; height: 62vh; z-index: 5; }
  #joy { position: fixed; width: 124px; height: 124px; border-radius: 50%; display: none; z-index: 6;
         border: 1px solid rgba(255,255,255,.18); background: rgba(10,18,28,.24); pointer-events: none; }
  #joyknob { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%;
             background: rgba(255,255,255,.32); border: 1px solid rgba(255,255,255,.5); }

  /* 运镜条 */
  #cinebar { left: 50%; transform: translateX(-50%); bottom: 30px; width: min(520px, 82vw); display: none;
             padding: 10px 16px 12px; border-radius: 14px; background: rgba(8,14,22,.55);
             backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12); text-align: center; }
  #cinelabel { font-size: 12.5px; letter-spacing: .16em; color: #ffe6b8; }
  #cinetime { font-size: 10.5px; opacity: .6; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .track { height: 2px; background: rgba(255,255,255,.16); border-radius: 2px; margin-top: 9px; overflow: hidden; }
  #cinefill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffcf87, #ff9d5c); }

  /* 载入 */
  #loading { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
             flex-direction: column; gap: 14px; background: #0b1220; transition: opacity .6s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .t { font-size: 13px; letter-spacing: .5em; opacity: .7; }
  #loading .bar { width: 120px; height: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: #ffcf87; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }

  #appstate { position: fixed; left: -9999px; top: 0; font-size: 1px; }
  @media (max-width: 520px) {
    #panel { width: 168px; top: 76px; right: 10px; padding: 10px; }
    #residents li { font-size: 10.5px; }
    #clock { font-size: 22px; }
    #hint { bottom: 150px; font-size: 10.5px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="leftzone"></div>
<div id="joy"><div id="joyknob"></div></div>

<div class="ui" id="top">
  <div id="brand">山谷小镇<small>VALLEY TOWN</small></div>
  <div id="meter">
    <div id="clock">08:12</div>
    <div class="sub">第 <span id="dayno">1</span> 天 · <span id="weathernow">晴</span> · <span id="fps">–</span> fps</div>
  </div>
</div>

<div class="ui" id="panel">
  <h3>此刻的居民</h3>
  <ul id="residents"></ul>
</div>

<div class="ui" id="hint">W A S D 走动 · 拖拽画面转头 · E 互动</div>
<div class="ui" id="toast"></div>

<div class="ui" id="dock">
  <div class="row">
    <button data-weather="clear" class="on">晴<span class="k">1</span></button>
    <button data-weather="rain">雨<span class="k">2</span></button>
    <button data-weather="fog">雾<span class="k">3</span></button>
    <button data-weather="snow">雪<span class="k">4</span></button>
  </div>
  <div class="row">
    <button data-act="time">昼夜<span class="k">N</span></button>
    <button data-act="fast">时间流速<span class="k">T</span></button>
    <button data-act="interact">互动<span class="k">E</span></button>
    <button data-act="cine">运镜预览<span class="k">C</span></button>
  </div>
</div>

<div class="ui" id="cinebar">
  <div id="cinelabel">01 谷口 · 大全景</div>
  <div id="cinetime">0:00 / 1:00</div>
  <div class="track"><div id="cinefill"></div></div>
</div>

<div id="loading"><div class="t">正在生长山谷</div><div class="bar"><i></i></div></div>
<div id="appstate"></div>

<script src="three.min.js"></script>
<script src="js/world.js"></script>
<script src="js/life.js"></script>
<script src="js/main.js"></script>
</body>
</html>
